<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Prędkości Dźwięku i Długości Fali</title>
</head>
<body>

    <h2>Kalkulator Prędkości Dźwięku i Długości Fali</h2>

    <fieldset>
        <legend>Dane wejściowe</legend>
        <p>
            <label for="osrodek">Ośrodek:</label>
            <select id="osrodek">
                <option value="powietrze">Powietrze</option>
                <option value="woda">Woda (20°C)</option>
                <option value="stal">Stal</option>
                <option value="szklo">Szkło</option>
            </select>
        </p>
        <p id="temp-box">
            <label for="temp">Temperatura (°C):</label>
            <input type="number" id="temp" value="20">
        </p>
        <p>
            <label for="freq">Częstotliwość fali (Hz):</label>
            <input type="number" id="freq" value="440">
        </p>
    </fieldset>

    <fieldset style="margin-top: 15px;">
        <legend>WYNIKI OBLICZEŃ</legend>
        <p>Prędkość dźwięku (v): <b id="out-v">-</b></p>
        <p>Długość fali (&lambda;): <b id="out-lambda">-</b></p>
    </fieldset>

    <script>
        const osrodekSelect = document.getElementById("osrodek");
        const tempInput = document.getElementById("temp");
        const tempBox = document.getElementById("temp-box");
        const freqInput = document.getElementById("freq");
        const outV = document.getElementById("out-v");
        const outLambda = document.getElementById("out-lambda");

        function przelicz() {
            let osrodek = osrodekSelect.value;
            let T = parseFloat(tempInput.value) || 0;
            let f = parseFloat(freqInput.value) || 1;
            
            let v = 0;
            if (osrodek === "powietrze") {
                tempBox.style.display = "block";
                v = 331.3 + (0.6 * T);
            } else {
                tempBox.style.display = "none";
                if (osrodek === "woda") v = 1484;
                else if (osrodek === "stal") v = 5100;
                else if (osrodek === "szklo") v = 5600;
            }
            
            let lambda = v / f;
            
            outV.innerText = v.toFixed(1) + " m/s";
            outLambda.innerText = lambda.toFixed(3) + " m (" + (lambda * 100).toFixed(2) + " cm)";
        }

        osrodekSelect.addEventListener("change", przelicz);
        tempInput.addEventListener("input", przelicz);
        freqInput.addEventListener("input", przelicz);

        przelicz();
    </script>

</body>
</html>
